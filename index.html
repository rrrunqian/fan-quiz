<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>影视与游戏知识闯关</title>
<style>
:root{--bg:#f4f8f6;--panel:#fff;--panel2:#f7faf9;--text:#263b35;--muted:#71827b;--accent:#76b7a2;--good:#3d9b78;--bad:#d87979}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#edf6f1 0,#f8faf8 55%,#f2f7f4 100%);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 14px 40px}
.wrap{max-width:680px;margin:0 auto}.top{text-align:center;margin:12px 0 22px}.eyebrow{color:#6a9f8d;letter-spacing:.14em;font-size:12px;font-weight:700}.top h1{font-size:clamp(25px,6vw,36px);margin:9px 0;color:#29463c}.top p{color:var(--muted);margin:0;line-height:1.7}
.card{background:rgba(255,255,255,.96);border:1px solid #e1ebe5;border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(57,91,75,.08)}
.hidden{display:none!important}.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}.bar{height:7px;background:#e7efeb;border-radius:10px;overflow:hidden;margin-bottom:22px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#80bea8,#a9d5c2);transition:width .2s}
.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#eaf4ef;color:#568b75;font-size:12px;font-weight:700}
.question{font-size:21px;line-height:1.55;margin:16px 0 20px;font-weight:750;color:#2d443b}.options{display:grid;gap:11px}.option{width:100%;text-align:left;border:1px solid #dfe9e4;background:var(--panel2);color:var(--text);border-radius:14px;padding:14px 15px;font-size:16px;line-height:1.45;cursor:pointer;transition:.15s}.option:focus{outline:2px solid var(--accent);outline-offset:2px}.option.selected{border-color:#79b69f;background:#edf7f2}
.actions{display:flex;gap:10px;margin-top:22px}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#83bda7;color:#173b2e;flex:1}.secondary{background:#edf3ef;color:#536b60}.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:15px;line-height:1.6}
.result{text-align:center}.score{font-size:58px;font-weight:850;margin:8px 0;color:var(--good)}.result h2{font-size:26px;margin:8px 0;color:#29463c}.result p{color:var(--muted);line-height:1.7}.reward{width:100%;max-height:70vh;object-fit:contain;border-radius:14px;margin:16px auto 4px;background:#f3f5f3}.fail .score{color:var(--bad)}
.review{margin:18px 0;text-align:left;background:#f5f8f6;border:1px solid #e5ede8;border-radius:14px;padding:14px;color:#53675e;font-size:14px;line-height:1.8}
@media(max-width:420px){.card{padding:18px}.question{font-size:19px}.option{font-size:15px;padding:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">THE ULTIMATE FAN QUIZ</div>
    <h1>影视与游戏知识闯关</h1>
    <p>10 道单选题 · 满分 10 分<br>答对 8 题及以上，即可解锁神秘奖励</p>
  </header>

  <section id="intro" class="card">
    <span class="tag">闯关规则</span>
    <h2>准备好接受挑战了吗？</h2>
    <p style="color:var(--muted);line-height:1.8">题目来自《豺狼的日子》《怪奇物语》《暗黑》和《星露谷物语》。每题只有一个正确答案。完成全部 10 题后统一公布成绩；未达到 8 题，需要重新挑战全部题目。</p>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="startQuiz()">开始答题</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progressrow"><span id="counter">第 1 / 10 题</span><span id="answered">已答 0 / 10</span></div>
    <div class="bar"><div id="progress"></div></div>
    <span id="category" class="tag"></span>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div class="actions">
      <button class="btn secondary" id="prev" onclick="move(-1)">上一题</button>
      <button class="btn primary" id="next" onclick="move(1)" disabled>下一题</button>
    </div>
    <div class="note">可以使用上一题检查或修改答案；提交后统一判分。</div>
  </section>

  <section id="result" class="card result hidden"></section>
</div>

 {c:"《豺狼的日子》",q:"在 2024 年剧集中，饰演“豺狼”的演员是谁？",o:["汤姆·希德勒斯顿","基里安·墨菲","埃迪·雷德梅恩","理查德·麦登"],a:2},

function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startQuiz(){
 questions=shuffle(bank).map(q=>{let opts=q.o.map((v,i)=>({v,correct:i===q.a}));opts=shuffle(opts);return {...q,o:opts.map(x=>x.v),a:opts.findIndex(x=>x.correct)}});
 answers=Array(10).fill(null);index=0;submitted=false;
 $("intro").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();
}
function render(){
 const q=questions[index];$("counter").textContent=`第 ${index+1} / 10 题`;
 $("answered").textContent=`已答 ${answers.filter(x=>x!==null).length} / 10`;
 $("progress").style.width=`${(index+1)*10}%`;$("category").textContent=q.c;$("question").textContent=q.q;
 $("options").innerHTML="";
 q.o.forEach((v,i)=>{const b=document.createElement("button");b.className="option"+(answers[index]===i?" selected":"");b.textContent=String.fromCharCode(65+i)+"．"+v;b.onclick=()=>{answers[index]=i;render()};$("options").appendChild(b)});
 $("prev").disabled=index===0;$("next").disabled=answers[index]===null;
 $("next").textContent=index===9?"提交答案":"下一题";
}
function move(d){if(d===1&&index===9){if(answers.some(x=>x===null))return;finish();return}index=Math.max(0,Math.min(9,index+d));render()}
